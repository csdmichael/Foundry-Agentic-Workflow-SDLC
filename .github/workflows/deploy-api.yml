# Deploys the Python/FastAPI API to Azure App Service — only when API files change.
name: Deploy API

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - '.github/workflows/deploy-api.yml'
  workflow_dispatch:

permissions:
  id-token: write # OIDC federated login to Azure (no stored secrets)
  contents: read

env:
  AZURE_WEBAPP_NAME: ${{ vars.API_WEBAPP_NAME }}
  PYTHON_VERSION: '3.13'

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - run: pip install -r requirements.txt
      - run: python -m pytest -q

      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # App Service runs Oryx build (SCM_DO_BUILD_DURING_DEPLOYMENT=true) to install
      # requirements.txt; startup command is set on the web app (gunicorn + uvicorn worker).
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: api

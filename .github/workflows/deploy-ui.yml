# Deploys the Angular/Ionic UI to Azure App Service — only when UI files change.
name: Deploy UI

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'angular.json'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/deploy-ui.yml'
  workflow_dispatch:

permissions:
  id-token: write # OIDC federated login to Azure (no stored secrets)
  contents: read

env:
  # TODO: set these as repository variables (Settings ▸ Secrets and variables ▸ Actions ▸ Variables).
  AZURE_WEBAPP_NAME: ${{ vars.UI_WEBAPP_NAME }}
  NODE_VERSION: '20.x'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci
      - run: npm run build

      # Federated (OIDC) login — configure a workload identity federation on the
      # app registration and set the secrets below. No client secret is stored.
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: dist/browser
